name: RVE Core Audit Checks

on:
  push:
    paths-ignore:
      - "ops/a52-agent/**"
      - ".agent-state/**"
  pull_request:
    paths-ignore:
      - "ops/a52-agent/**"
      - ".agent-state/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rve-core-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RVE core checks (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned core dependencies
        run: python -m pip install numpy==2.4.3 pandas==3.0.1 PyYAML==6.0.3

      - name: Compile RVE Python modules
        run: python -m compileall -q layer1 fetch

      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -v
