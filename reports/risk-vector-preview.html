<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RVE Layer 1</title><style>
:root{color-scheme:dark;--bg:#10151d;--line:#2b3949;--muted:#a8b6c7;--text:#edf4fb;--blue:#70b7ff;--red:#ff8282}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#203143 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:38px 20px 60px}.muted,.detail{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{background:#19222e;border:1px solid var(--line);border-radius:15px;padding:20px}.wide{grid-column:1/-1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--line);border-radius:11px;padding:12px;background:#111923}.label,.detail{font-size:12px}.value{font-size:25px;font-weight:750}.badge{display:inline-block;border:1px solid #81692f;background:#3b311b;color:#ffe09a;border-radius:99px;padding:4px 10px;font-size:12px}.error{color:#ffd0d0}.bars{margin-top:18px}.barrow{display:grid;grid-template-columns:125px 1fr 120px;gap:10px;align-items:center;margin:12px 0}.track{height:10px;background:#0d131a;border-radius:20px;position:relative}.track:after{content:"";position:absolute;left:50%;top:-3px;height:16px;width:1px;background:#8493a4}.fill{height:100%;position:absolute;background:var(--blue);border-radius:20px}.fill.neg{background:var(--red)}.barval{text-align:right;font-size:13px}.notice{padding:14px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.barrow{grid-template-columns:100px 1fr 110px}}
</style></head><body><main><header><div class="muted">Risk Vector Engine · Layer 1</div><h1>リスクベクトル</h1><p><span class="badge" id="status">計算データを確認中</span> <span class="muted" id="asof"></span></p></header>
<div class="grid"><section class="card"><h2>個別資産 <span class="muted" id="asset-symbol"></span></h2><div id="asset"></div></section><section class="card"><h2>ポートフォリオ <span class="muted" id="portfolio-mode"></span></h2><div id="portfolio"></div></section>
<section class="card wide"><h2>指標の読み方</h2><p class="muted">σは週次標本標準偏差の年率値、ESは損失上位8週の平均、βは各アンカーへの単回帰感応度です。正規化値は銘柄自身の直前52週との比較で、異なる銘柄の絶対リスク比較には使えません。</p><p class="muted">^GSPCは価格指数、ETFの調整後終値は分配金込みの系列となり得るため、リターン定義は完全には同一ではありません。</p><div class="muted" id="sources"></div></section></div>
<p class="muted">未生成の計算結果はゼロやサンプル値で代替しません。ローカルでは <code>python layer1/layer1_vector.py</code> を実行してください。</p></main>
<script src="risk-vector-preview.js"></script></body></html>
